version: 1
defaults:
  max_seconds: 10
  walk_speed: 4.317
  corridor_margin: 16
checks:
  - check: travel_time
    zone: mine_a
    from: mine_a_spawn
    to: mine_a_exit
  - check: travel_time
    zone: mine_a
    from: mine_a_exit
    to: sell_npc_a
  - check: warp_safe
    zone: mine_a
    at: mine_a_spawn
  - check: travel_time
    zone: mine_b
    from: mine_b_spawn
    to: mine_b_exit
  - check: warp_safe
    zone: mine_b
    at: mine_b_spawn
  - check: travel_time
    zone: mine_c
    from: mine_c_spawn
    to: mine_c_exit
  - check: warp_safe
    zone: mine_c
    at: mine_c_spawn
  - check: warp_safe
    zone: lumber
    at: lumber_spawn
  - check: path_exists
    id: mine_b_spawn_to_surface
    zone: mine_b
    world: mine_b
    from: mine_b_spawn
    to: "13,64,36"
  - check: entity_clear
    zone: mine_b
    at: sell_npc_b
  - check: entity_clear
    zone: mine_b
    at: rankup_npc_b
  - check: path_exists
    id: mine_c_spawn_to_surface
    zone: mine_c
    world: mine_c
    from: mine_c_spawn
    to: "13,64,36"
  - check: entity_clear
    zone: mine_c
    at: sell_npc_c
  - check: entity_clear
    zone: mine_c
    at: rankup_npc_c
  - check: path_exists
    id: mine_a_spawn_to_surface
    zone: mine_a
    world: mine_a
    from: mine_a_spawn
    to: "13,64,36"
  - check: entity_clear
    zone: mine_a
    at: sell_npc_a
  - check: entity_clear
    zone: mine_a
    at: rankup_npc_a
  - check: mine_valid
    zone: mine_a
    region: mine_a
    spec: specs/mine_a.json
  - check: mine_valid
    zone: mine_b
    region: mine_b
    spec: specs/mine_b.json
  - check: mine_valid
    zone: mine_c
    region: mine_c
    spec: specs/mine_c.json
  - check: mine_valid
    zone: lumber
    region: lumber
    spec: specs/lumber.json
  - check: path_exists
    id: lumber_spawn_to_surface
    zone: lumber
    world: lumber
    from: lumber_spawn
    to: "14,65,30"
  - check: offdisk_clear
    zone: mine_a
    world: mine_a
  - check: offdisk_clear
    zone: mine_b
    world: mine_b
  - check: offdisk_clear
    zone: mine_c
    world: mine_c
  - check: offdisk_clear
    zone: lumber
    world: lumber
  - check: no_holes
    region: plots_0_0
    floor_y: 65
  - check: entity_clear
    at: plots_entrance_sign
  - check: region_inside
    inner: contested_boundary
    outer: contested_walkable
  - check: no_holes
    region: contested_room
    floor_y: 66
    inset: 1
