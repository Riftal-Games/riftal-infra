version: 1
defaults:
  max_seconds: 10
  walk_speed: 4.317
  corridor_margin: 16
checks:
  - check: travel_time
    from: mine_a_spawn
    to: mine_a_exit
  - check: travel_time
    from: mine_a_exit
    to: sell_npc_a
  - check: warp_safe
    at: mine_a_spawn
  - check: entity_clear
    at: sell_npc_a
  - check: mine_valid
    region: mine_a
    spec: specs/mine_a.json
