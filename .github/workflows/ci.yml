name: CI

# Pull requests gate every merge. Pushes are watched on main only, so a branch
# push and its pull request do not bill two runs for the same commit. These are
# private repositories and workflow minutes are metered.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned. An unpinned linter changes the meaning of a merge gate with no
  # commit to point at.
  HADOLINT_VERSION: v2.12.0

jobs:
  checks:
    name: lint and validate
    runs-on: [self-hosted, linux, riftal]
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # Before any step that starts a container, so every one of them carries
      # this job's label for the sweep at the end.
      - name: Label this job's containers
        run: bash .github/scripts/ci-docker-label.sh

      - name: Self-test, prove the label and the sweep
        run: bash .github/scripts/ci-sweep-selftest.sh

      - name: Install hadolint
        # /usr/local/bin is root-owned on the self-hosted runner, unlike the
        # hosted image where the runner user already owns it.
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/hadolint \
            "https://github.com/hadolint/hadolint/releases/download/${HADOLINT_VERSION}/hadolint-Linux-x86_64"
          sudo install -m 0755 /tmp/hadolint /usr/local/bin/hadolint
          hadolint --version

      # Runs before the real scans on purpose. images/ and proxy/ hold only a
      # .gitkeep today, so the scans below have nothing to look at and would go
      # green by being empty. This step feeds every check a fixture it must
      # reject and a fixture it must accept, so the checks are known to
      # discriminate on this commit and not only on the day they were written.
      - name: Self-test, prove every check can fail
        run: bash .github/scripts/selftest.sh

      # Both scans run the shared script, and the self-test above drives that
      # same script, discovery, dispatch, both check_ functions and the loop,
      # so a scan finding nothing here reflects an empty tree, not a check
      # nothing has ever run.
      - name: Lint Dockerfiles and Containerfiles
        run: bash .github/scripts/scan.sh dockerfiles

      - name: Validate compose files
        run: bash .github/scripts/scan.sh compose

      - name: Containers leave no anonymous volumes
        run: bash .github/scripts/container-cleanup.sh

      # No PHP on the runner is confirmed, so the check runs inside a pinned
      # php:8.3-cli-alpine container instead of assuming a host binary.
      - name: Lint PHP plugins
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(images/plugins/*.php images/plugins/join-order/*.php)
          if [ "${#files[@]}" -eq 0 ]; then
            printf 'no PHP plugin files to lint\n'
            exit 0
          fi
          docker run --rm -v "$PWD/images/plugins:/plugins:ro" php:8.3-cli-alpine \
            sh -c '
              status=0
              for f in /plugins/*.php /plugins/join-order/*.php; do
                php -l "$f" || status=1
              done
              exit "$status"
            '

      # astral-sh/setup-uv v10.0.1, pinned by commit so a tag move cannot
      # change the installer, and by uv version so the resolver matches the
      # one on the development machine.
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.12.0"

      - name: Dev bots admission guard self-test
        run: bash images/plugins/selftest.sh

      - name: Pinned core image self-test
        run: bash images/core-image-selftest.sh

      - name: Dev bots join order self-test
        run: bash images/plugins/join-order/selftest.sh

      - name: Instance-only plugin mount self-test
        run: bash images/plugins/instance-only/selftest.sh

      - name: Migration runner self-test
        run: bash migrations/selftest.sh

      - name: Backup job self-test
        run: bash deploy/selftest.sh

      - name: Restore drill self-test
        run: bash deploy/restore-selftest.sh

      - name: Binlog retention check self-test
        run: bash deploy/binlog-selftest.sh

      - name: Wipe self-test
        run: bash deploy/wipe-selftest.sh

      # Runs before the host-side sync below, which writes designer/.venv. The
      # script mounts the project read-only, so a container run that tried to
      # put its environment in the checkout fails here instead of leaving one.
      - name: Designer toolkit tests in a container
        run: sh designer/container-test.sh

      # --locked fails when uv.lock no longer matches pyproject.toml, where
      # --frozen would install the stale lock as-is. Once this sync has
      # validated the lock, the later uv run calls can stay --frozen.
      - name: Designer toolkit tests
        working-directory: designer
        run: |
          set -euo pipefail
          uv sync --locked --group dev
          uv run --frozen pytest -q

      - name: TOOLS.md matches the registered tools
        working-directory: designer
        run: uv run --frozen python -m designer.tools_doc --check

      # always() rather than failure(): a cancelled run is the case that leaks,
      # because the runner kills a self-test before its EXIT trap fires.
      - name: Remove this job's containers
        if: always()
        run: bash .github/scripts/ci-container-sweep.sh
