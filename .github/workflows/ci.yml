name: CI

# Pull requests gate every merge. Pushes are watched on main only, so a branch
# push and its pull request do not bill two runs for the same commit. These are
# private repositories and workflow minutes are metered.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A cancel would end bot-proofs before it files its exposure.
  cancel-in-progress: false

env:
  # Pinned. An unpinned linter changes the meaning of a merge gate with no
  # commit to point at.
  HADOLINT_VERSION: v2.12.0
  # hadolint-Linux-x86_64.sha256 from the v2.12.0 release. Recorded here, not
  # fetched at run time, so a replaced release asset fails the install. A new
  # HADOLINT_VERSION needs its own hash.
  HADOLINT_SHA256: 56de6d5e5ec427e17b74fa48d51271c7fc0d61244bf5c90e828aab8362d55010

jobs:
  checks:
    name: lint and validate
    runs-on: [self-hosted, linux, riftal]
    # ci-sweep-selftest.sh removes its other-job volumes once they are older
    # than its reap_after, as left by a run that has ended, and fails unless
    # every job here times out sooner. The capture proofs take four of these.
    #
    # A run on an idle daemon takes about 14 minutes. Runners of every repo
    # share one docker daemon, and a single step there has run 1.3 to 2.6 times
    # longer while another build runs. The steps do not all slow at once, so 30
    # covers twice the idle time of the whole job, not 2.6 times. A concurrency
    # group cannot serialise this job: it queues one pending run and cancels
    # the others, and it cannot see another repo's builds.
    timeout-minutes: 30

    steps:
      # actions/checkout v4.4.0, pinned by commit so a tag move cannot change
      # what runs with this job's token.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # Reads fixtures only, so it runs before any step that starts a
      # container and no engine fault can mask it.
      - name: Self-test, prove the job timeout check can fail
        run: bash .github/scripts/job-timeouts-selftest.sh

      - name: Self-test, prove the bot-proofs scope check can fail
        run: bash .github/scripts/bot-proofs-scope-selftest.sh

      # Reads files only, for the same reason as the step above.
      - name: Self-test, prove the mysql:8 pull order check can fail
        run: bash .github/scripts/pull-mysql-order-selftest.sh

      - name: Pull mysql:8 runs before every step that runs mysql:8
        run: bash .github/scripts/pull-mysql-order.sh

      # docker compose config only, no container, so these also run before
      # any container step.
      - name: Self-test, prove the wslc run drift check can fail
        run: bash .github/scripts/wslc-drift-selftest.sh

      - name: Documented wslc run commands match images/compose.yaml
        run: bash .github/scripts/wslc-drift.sh

      # Reads fixture logs only, so it also runs before any container step.
      - name: Custody alert check self-test
        run: bash deploy/custody-alert-check-selftest.sh

      - name: Grants REVOKE check self-test
        run: bash deploy/grants-revoke-check-selftest.sh

      # Reads instances/, designer/levels/ and /usr/bin/jq only, so it also
      # runs before any container step.
      - name: Instance definitions list only built zones
        run: |
          bash deploy/instance-levels-check-selftest.sh
          bash deploy/instance-levels-check.sh

      # Synthetic timings and fixture configs only, so it also runs before any
      # container step.
      - name: Write latency check self-test
        run: bash deploy/write-latency-selftest.sh

      # Before any step that starts a container, so every one of them carries
      # this job's label for the sweep at the end.
      - name: Label this job's containers
        run: bash .github/scripts/ci-docker-label.sh

      - name: Self-test, prove the label and the sweep
        run: bash .github/scripts/ci-sweep-selftest.sh

      # Sets HADOLINT for every later step, so the self-test and the scan below
      # run the binary this job checked, not whichever hadolint PATH finds.
      - name: Install hadolint
        run: bash .github/scripts/install-hadolint.sh

      # Runs before the real scans on purpose. A scan that finds nothing exits
      # 0, so a green scan alone cannot tell a clean tree from a check that
      # never ran. This step feeds every check a fixture it must reject and a
      # fixture it must accept, so the checks are known to discriminate on
      # this commit.
      - name: Self-test, prove every check can fail
        run: bash .github/scripts/selftest.sh

      # Every scan runs the shared script, and the self-test above drives that
      # same script, discovery, dispatch, every check_ function and the loop,
      # so a scan finding nothing here reflects an empty tree, not a check
      # nothing has ever run.
      - name: Lint Dockerfiles and Containerfiles
        run: bash .github/scripts/scan.sh dockerfiles

      - name: Validate compose files
        run: bash .github/scripts/scan.sh compose

      # The same discovery as the step above, so a compose file validated
      # there is never one this policy skips.
      - name: Compose port policy, 19132 as udp, binds on 127.0.0.1
        run: bash .github/scripts/scan.sh ports

      - name: Every action is pinned by commit sha or image digest
        run: bash .github/scripts/action-pins.sh

      - name: Containers leave no anonymous volumes
        run: bash .github/scripts/container-cleanup.sh

      # No PHP on the runner is confirmed, so the check runs inside a pinned
      # php:8.3-cli-alpine container instead of assuming a host binary.
      - name: Lint PHP plugins
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(images/plugins/*.php images/plugins/join-order/*.php images/plugins/crash-hook/*.php images/plugins/tile-contents/*.php images/plugins/capture-harness/*.php images/plugins/restart/*.php images/plugins/watch/*.php)
          if [ "${#files[@]}" -eq 0 ]; then
            printf 'no PHP plugin files to lint\n'
            exit 0
          fi
          docker run --rm -m 1g --cpus 1 -v "$PWD/images/plugins:/plugins:ro" php:8.3-cli-alpine \
            sh -c '
              status=0
              for f in /plugins/*.php /plugins/join-order/*.php /plugins/crash-hook/*.php /plugins/tile-contents/*.php /plugins/capture-harness/*.php /plugins/restart/*.php /plugins/watch/*.php; do
                php -l "$f" || status=1
              done
              exit "$status"
            '

      # astral-sh/setup-uv v10.0.1, pinned by commit so a tag move cannot
      # change the installer, and by uv version so the resolver matches the
      # one on the development machine.
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.12.0"

      - name: Dev bots admission guard self-test
        run: bash images/plugins/selftest.sh

      - name: Pinned core image self-test
        run: bash images/core-image-selftest.sh

      - name: Release image self-test
        run: bash deploy/release-image-selftest.sh

      - name: Bot proofs pre-container checks and devtools pin self-test
        run: bash .github/scripts/bot-proofs-selftest.sh

      - name: Self-test, prove the bot-proofs finish decision can fail
        run: bash .github/scripts/bot-proofs-finish-selftest.sh

      - name: Capture plugin self-test
        run: bash images/plugins/capture-selftest.sh

      # The self-test above runs the plugin against fakes of the core. This
      # boots the core itself, where the fakes and the server can disagree.
      # A healthy run takes under a minute. Ten covers its worst case that
      # still ends: every wait in harness.sh running out, both boots at their
      # 120 seconds and both stops at their 60, about nine minutes.
      - name: Capture plugin in-server harness
        timeout-minutes: 10
        run: bash images/plugins/capture-harness/harness.sh

      - name: Dev bots join order self-test
        run: bash images/plugins/join-order/selftest.sh

      # A healthy run takes under half a minute. The bound keeps one wedged
      # boot from spending the rest of the job's 30 minutes.
      - name: Dev bots watch camera self-test
        timeout-minutes: 10
        run: bash images/plugins/watch/selftest.sh

      - name: Dev bots crash hook self-test
        run: bash images/plugins/crash-hook/selftest.sh

      - name: Dev bots tile contents self-test
        run: bash images/plugins/tile-contents/selftest.sh

      - name: Instance-only plugin mount self-test
        run: bash images/plugins/instance-only/selftest.sh

      - name: start.sh parity check self-test
        run: bash images/plugins/instance-only/check-start-sh-selftest.sh

      - name: start-instance.sh checked against the image's start.sh
        run: bash images/plugins/instance-only/check-start-sh.sh

      - name: Instance boot on the pinned core image self-test
        run: bash images/plugins/instance-only/boot-selftest.sh

      # Boots the pinned core image three times, the first to generate the fixture level.
      # A healthy run takes under a minute; the bound stops one wedged boot spending the job's 30 minutes.
      - name: Level seed step on the pinned core image self-test
        timeout-minutes: 10
        run: bash images/plugins/seed-levels-selftest.sh

      - name: Instance-b start script self-test
        run: bash images/plugins/instance-b/selftest.sh

      - name: Instance restart policy and boot gate self-test
        run: bash images/plugins/restart/selftest.sh

      - name: Dev faults hook self-test
        run: bash images/plugins/dev-faults/selftest.sh

      - name: RiftalCustody on every instance self-test
        run: bash images/custody-selftest.sh

      - name: Self-test, prove the mysql:8 pull can fail
        run: bash .github/scripts/pull-mysql-selftest.sh

      # Every step from here to the wipe self-tests runs mysql:8, a floating tag.
      # This pulls its newest release, so the runner's cached copy cannot go
      # stale unseen. Compose pulls it only when missing.
      - name: Pull mysql:8
        run: bash .github/scripts/pull-mysql.sh

      - name: Migration runner self-test
        run: bash migrations/selftest.sh

      - name: Backup job self-test
        run: bash deploy/selftest.sh

      - name: Restore drill self-test
        run: bash deploy/restore-selftest.sh

      - name: Compose dump login self-test
        run: bash images/dump-login-selftest.sh

      - name: Binlog retention check self-test
        run: bash deploy/binlog-selftest.sh

      - name: Wipe self-test
        run: bash deploy/wipe-selftest.sh

      - name: Wipe volumes self-test
        run: bash deploy/wipe-volumes-selftest.sh

      - name: Write latency probe self-test
        run: bash deploy/write-latency-probe-selftest.sh --probe

      # ADR 015 proofs 3, 4 and 5 without bots, on the pinned core, and each
      # mutant of backup.sh going red. A healthy run takes about four minutes.
      - name: Capture proofs on the real core
        timeout-minutes: 9
        run: bash deploy/capture-proofs.sh

      # Runs before the host-side sync below, which writes designer/.venv. The
      # script mounts the project read-only, so a container run that tried to
      # put its environment in the checkout fails here instead of leaving one.
      - name: Designer toolkit tests in a container
        run: sh designer/container-test.sh

      # --locked fails when uv.lock no longer matches pyproject.toml, where
      # --frozen would install the stale lock as-is. Once this sync has
      # validated the lock, the later uv run calls can stay --frozen.
      - name: Designer toolkit tests
        working-directory: designer
        run: |
          set -euo pipefail
          uv sync --locked --group dev
          uv run --frozen pytest -q

      - name: TOOLS.md matches the registered tools
        working-directory: designer
        run: uv run --frozen python -m designer.tools_doc --check

      # Both need the PyYAML that designer/uv.lock pins, so they follow the sync.
      - name: Self-test, prove the exposure=pending order check can fail
        run: uv run --frozen --project designer python .github/scripts/exposure_pending_selftest.py

      - name: bot-proofs writes exposure=pending before any step that may start a bot
        run: uv run --frozen --project designer python .github/scripts/exposure_pending_order.py

      # Riots treats a world as safe once any region in it carries safe_zone, so
      # a ranked mine without one is open PvP and a contested world with one is
      # not contested. Standard library only; uv run supplies the interpreter.
      - name: Self-test, prove the safe_zone region check can fail
        run: uv run --frozen --project designer python -I .github/scripts/safe_zones_selftest.py

      - name: Every ranked world has a safe_zone region and contested has none
        run: uv run --frozen --project designer python -I .github/scripts/safe_zones.py

      # always() rather than failure(): a cancelled run is the case that leaks,
      # because the runner kills a self-test before its EXIT trap fires.
      - name: Remove this job's containers
        if: always()
        run: bash .github/scripts/ci-container-sweep.sh

  # Decides whether bot-proofs has a bot to stop. It starts nothing, and a
  # failure or an empty output leaves bot-proofs running.
  bot-proofs-scope:
    name: bot proofs scope
    runs-on: [self-hosted, linux, riftal]
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      serves: ${{ steps.scope.outputs.serves }}

    steps:
      # The full history, because the diff needs the merge base.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Changed paths and whether they serve bot-proofs
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          . .github/scripts/bot-proofs-scope.sh
          scope_run "$EVENT" "$BASE" "$HEAD" "$GITHUB_OUTPUT"

  # ADR 024. The job holds a read token, starts two servers and their bots, and every
  # check before a container refuses with ::error:: and ends the job.
  bot-proofs:
    name: bot proofs
    needs: bot-proofs-scope
    # always() so a scope job that failed or wrote nothing still runs this one.
    if: always() && needs.bot-proofs-scope.outputs.serves != 'false'
    runs-on: [self-hosted, linux, riftal]
    # Under ci-sweep-selftest.sh's reap_after, like every job here.
    timeout-minutes: 23
    permissions:
      contents: read
      issues: read
    outputs:
      exposure: ${{ steps.harness.outputs.exposure || steps.pending.outputs.exposure || steps.exposure.outputs.exposure }}

    steps:
      # persist-credentials: false leaves no token in .git/config for any step
      # that runs code from the PR head.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Runner has /usr/bin/jq and /usr/bin/curl
        run: |
          . .github/scripts/bot-proofs-checks.sh
          runner_tools_present

      # ADR 024 names pending, found and none. no-bots is this job's own
      # starting value, held until a bot starts, and files nothing. The job
      # output takes the exposure written by a step with id harness when
      # one ran, else the pending step's, else this step's.
      - name: Exposure, no bot has started
        id: exposure
        run: printf 'exposure=no-bots\n' >> "$GITHUB_OUTPUT"

      - name: networkingMode=bridged in .wslconfig
        run: |
          . .github/scripts/bot-proofs-checks.sh
          wslconfig_bridged

      - name: No open bots-stopped issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          . .github/scripts/bot-proofs-checks.sh
          bots_stopped_clear

      - name: Record the eth0 address
        id: eth0
        run: |
          . .github/scripts/bot-proofs-checks.sh
          if ! address="$(eth0_address)"; then
            printf '%s\n' "$address"
            exit 1
          fi
          printf 'eth0 address %s\n' "$address"
          printf 'address=%s\n' "$address" >> "$GITHUB_OUTPUT"

      - name: Label this job's containers
        run: bash .github/scripts/ci-docker-label.sh

      - name: Extract the pinned devtools image
        run: |
          . images/devtools-image.sh
          devtools_extract "$RUNNER_TEMP/riftal-devtools"

      # Every step from here may start a bot. A run that ends before the harness
      # step writes found or none leaves this as the output, and it is filed.
      - name: Exposure, bots may start
        id: pending
        run: printf 'exposure=pending\n' >> "$GITHUB_OUTPUT"

      - name: Pull mysql:8
        run: bash .github/scripts/pull-mysql.sh

      # After the pending write, so the allowlist ahead of it does not apply. The
      # job's read token is in the env of this step and of the bots-stopped check
      # only, never the job's, and the checkout left none in .git/config. The
      # harness step carries no env, so the script is handed over as a file.
      - name: Fetch main's merge-base backup script
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          . .github/scripts/bot-proofs-checks.sh
          merge_base_script "$HEAD_SHA" "$RUNNER_TEMP/merge-base"

      # The one form the exposure check compares. The script reads the eth0
      # address itself, since this step carries no env.
      - name: Harness
        id: harness
        run: |
          status=0
          env -u GITHUB_OUTPUT bash deploy/bot-proofs.sh || status=$?
          case "$status" in
            0|4) printf 'exposure=none\n' >> "$GITHUB_OUTPUT" ;;
            3) printf 'exposure=found\n' >> "$GITHUB_OUTPUT" ;;
          esac
          exit "$status"

      - name: Remove this job's containers
        if: always()
        run: bash .github/scripts/ci-container-sweep.sh

  # The only job with issues: write. It has no checkout, so no step in it
  # runs a script from the PR's tree; the run: block below is in the workflow
  # file, which review covers.
  bots-stopped-file:
    name: file bots-stopped
    needs: bot-proofs
    if: always() && (needs.bot-proofs.outputs.exposure == 'found' || needs.bot-proofs.outputs.exposure == 'pending')
    runs-on: [self-hosted, linux, riftal]
    timeout-minutes: 5
    permissions:
      issues: write

    steps:
      - name: Open a bots-stopped issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPOSURE: ${{ needs.bot-proofs.outputs.exposure }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          title="bots-stopped: exposure $EXPOSURE in run ${GITHUB_RUN_ID}"
          body="The bot-proofs job ended with exposure \`$EXPOSURE\` at $HEAD_SHA: $RUN_URL. found means a listing showed a socket that is exposure; pending means bots ran and the run ended before every listing was judged. A run started after this is not evidence. Only the steward or Nasir closes this (ADR 024 item 3)."
          /usr/bin/jq -n --arg title "$title" --arg body "$body" \
            '{title: $title, body: $body, labels: ["bots-stopped"]}' |
            /usr/bin/curl -fsS -X POST \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -d @- "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/issues" >/dev/null
          printf 'opened a bots-stopped issue for run %s\n' "$GITHUB_RUN_ID"
