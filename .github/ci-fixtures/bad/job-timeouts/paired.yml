# Must fail job-timeouts.sh: one job has no timeout-minutes and the other, a
# call, carries one GitHub refuses on a call. A check that counts timeouts
# against jobs instead of pairing them reads one of each and passes.
on: push
jobs:
  untimed:
    runs-on: ubuntu-24.04
    steps:
      - run: "true"
  call:
    uses: Riftal-Games/riftal-infra/.github/workflows/ci.yml@ad88fa0a1b2c3d4e5f60718293a4b5c6d7e8f901
    timeout-minutes: 5
