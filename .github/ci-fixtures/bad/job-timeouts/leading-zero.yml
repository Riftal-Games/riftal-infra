# Must fail job-timeouts.sh under a 1200-second cutoff: 023 is 23 minutes read
# as decimal, the larger of its two readings, and 19 read as octal, so a check
# that leaves shell arithmetic to read it as octal passes it.
on: push
jobs:
  only:
    runs-on: ubuntu-24.04
    timeout-minutes: 023
    steps:
      - run: "true"
