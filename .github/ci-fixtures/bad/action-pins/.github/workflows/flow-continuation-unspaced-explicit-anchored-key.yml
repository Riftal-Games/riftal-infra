# Must fail action-pins.sh at line 9 and nowhere else: an unspaced `?` and an
# anchor before a uses key opening a continuation line of a flow mapping, which
# PyYAML reads as an explicit key.
on: push
jobs:
  a:
    runs-on: ubuntu-latest
    steps: [{name: a,
?&k uses : actions/checkout@11d5960a326750d5838078e36cf38b85af677262}]
