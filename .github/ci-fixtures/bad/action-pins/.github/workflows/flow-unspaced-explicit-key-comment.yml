# Must fail action-pins.sh at line 9 and nowhere else: the same unspaced `?`
# uses key after a `{`, with a comment after the key and the value on the next
# line, which PyYAML reads as an explicit key.
on: push
jobs:
  a:
    runs-on: ubuntu-latest
    steps:
      - { ?uses # the action
          : actions/checkout@11d5960a326750d5838078e36cf38b85af677262 }
