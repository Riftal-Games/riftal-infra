# start-instance.sh copies this to /data/plugin_data/RiftalEconomy/config.yml
# on every boot, so this file stays authoritative; PluginBase::saveDefaultConfig()
# never overwrites a file that already exists there.
#
# Everything below except the schema is the plugin's own shipped default
# (images/riftal-game-snapshot/economy/resources/config.yml), sell shop
# prices included. selftest.sh compares every line to that file but comments,
# blanks and the schema, which it checks against the one compose creates,
# riftal_dev. The password stays empty: RiftalGames\Lib\Database\DatabaseSettings reads the
# economy login's password from RIFTAL_DB_PASSWORD_ECONOMY in the instance's
# environment, and throws if this file holds one too (ADR 008 item 5).
database:
  host: "mysql"
  schema: "riftal_dev"
  username: "economy"
  password: ""
  port: 3306
  worker-limit: 1

sell-shop:
  form-reopen-seconds: 5
  prices:
    "minecraft:cobblestone": 5
    "minecraft:coal": 5
    "minecraft:raw_copper": 5
    "minecraft:raw_iron": 5
    "minecraft:raw_gold": 5
    "minecraft:diamond": 5
    "minecraft:lapis_lazuli": 5
    "minecraft:oak_log": 5
    "minecraft:andesite": 5
    "minecraft:wheat": 5
    "minecraft:carrot": 5

auction-house:
  listing-tax-percent: 10

shop-chests:
  world: "plots"
