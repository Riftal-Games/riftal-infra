# start-instance.sh copies this to /data/plugin_data/RiftalRanks/config.yml on
# every boot, so this file stays authoritative; PluginBase::saveDefaultConfig()
# never overwrites a file that already exists there.
#
# Everything below except the schema is the plugin's own shipped default
# (riftal-game/ranks/resources/config.yml), which selftest.sh compares to that
# file. The schema is the one compose creates, riftal_dev. The password stays
# empty: RiftalGames\Lib\Database\DatabaseSettings reads the ranks login's
# password from RIFTAL_DB_PASSWORD_RANKS in the instance's environment, and
# throws if this file holds one too (ADR 008 item 5).
database:
  host: "mysql"
  schema: "riftal_dev"
  username: "ranks"
  password: ""
  port: 3306
  worker-limit: 1

rank_order: ["A", "B", "C"]
