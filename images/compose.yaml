# The local dev stack: one MySQL, one core instance, one network. No proxy.
# WaterdogPE is deferred until instances actually split, so the instance is the
# entry point a client connects to. See ../../docs/decision-log.md, 2026-09-12.
#
# Standard docker compose. wslc has no compose verb, so /dev-stack carries the
# hand translation to `wslc run` flags. Nothing here may depend on wslc.
services:
  mysql:
    image: mysql:8
    # Loopback only. Nothing outside this machine has any reason to reach the
    # database, and a MySQL on a LAN interface is a far worse door than a game
    # port.
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      # No default, on purpose. An unset value stops MySQL with "Database is
      # uninitialized and password option is not specified", which is the
      # failure we want over a committed password that works.
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: riftal_dev
    volumes:
      - riftal-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s
    # An unbounded stack exhausted the dev PC's memory and froze it
    # (riftal-infra#460).
    mem_limit: 1G
    cpus: 1
    networks:
      - riftal-dev

  instance:
    image: local-pocketmine-mp
    # Same reason as on mysql, above.
    mem_limit: 2G
    cpus: 2
    # The server takes console commands on stdin, and `stop` on stdin is the
    # only clean shutdown. An abrupt halt can corrupt a world mid-write.
    stdin_open: true
    # Loopback by default, so joining from a phone is a deliberate act and not
    # a leftover. INSTANCE_BIND=0.0.0.0 opens it to the LAN; see /dev-stack for
    # what else that needs and for why it is never a public interface.
    ports:
      - "${INSTANCE_BIND:-127.0.0.1}:19132:19132/udp"
    # The image declares VOLUME for both /data and /plugins, so anything left
    # unmounted gets a fresh anonymous volume on every container start. Those
    # accumulate under hash names that no cleanup rule can recognise.
    volumes:
      - riftal-world:/data
      - ./plugins:/plugins
      # Read-only: RiftalCapture only reads the backup's request here, and
      # stages its answer on /data (ADR 015 item 2).
      - riftal-capture:/capture:ro
      # Outside /data for the same root-mountpoint reason given below;
      # deliver-world-index.sh copies it into each consuming plugin's folder.
      - ../designer/world_index.json:/etc/riftal/world_index.json:ro
      # The built levels, which seed-levels.sh copies onto riftal-world when
      # worlds/<zone> is absent (ADR 009 items 5 and 6). Read-only and outside
      # /data, for the same root-mountpoint reason as above.
      - riftal_smoke_level_lumber:/etc/riftal/levels/lumber:ro
      - riftal_smoke_level_mine_a:/etc/riftal/levels/mine_a:ro
      - riftal_smoke_level_mine_b:/etc/riftal/levels/mine_b:ro
      - riftal_smoke_level_mine_c:/etc/riftal/levels/mine_c:ro
      - riftal_smoke_level_quarry:/etc/riftal/levels/quarry:ro
      - riftal_smoke_level_farm:/etc/riftal/levels/farm:ro
    # RiftalMines resets the worlds this instance hosts and no others, and
    # RiftalRanks is wanted on this instance alone (riftal-infra#558), so
    # instance-b holds neither login. RiftalEconomy and RiftalPlots load on
    # both (riftal-infra#887, #348, #345). start-instance.sh adds whichever of
    # the four are built to this container's own copy of the plugin roster
    # rather than mounting a file
    # into ./plugins or /data,
    # where Docker would create the mountpoint as root: in the ./plugins that
    # instance-b loads from, or as a /data/plugin_data PocketMine then cannot
    # write to. See plugins/instance-only/README.md.
    #
    # RiftalCustody loads on every instance from the top of ./plugins, and
    # require-custody.sh stops a boot where it is not built (ADR 013 item 11).
    # RiftalAccounts and contracts.phar load the same way, guarded by
    # require-accounts.sh.
    command:
      - bash
      - /plugins/restart/boot-gate.sh
      - bash
      - /plugins/deliver-world-index.sh
      - bash
      - /plugins/seed-levels.sh
      - bash
      - /plugins/require-accounts.sh
      - bash
      - /plugins/require-custody.sh
      - bash
      - /plugins/instance-only/start-instance.sh
    # No retry cap: Docker counts on-failure:<N> over the container's whole
    # life, so a capped server that crashes now and then eventually stays down
    # for good. unless-stopped and always would restart a `stop` on stdin,
    # which exits 0. boot-gate.sh, first in the command, stops a bad deploy
    # from restarting forever.
    restart: on-failure
    # start_period covers a first boot generating spawn terrain.
    healthcheck: &raknet-health
      test: ["CMD", "php", "/plugins/restart/raknet-ping.php"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
    environment:
      # Tags every shared-database row this instance writes, so a world
      # split later still shows who wrote what. No default, like
      # MYSQL_ROOT_PASSWORD above: RiftalGames\Lib\InstanceIdentity::
      # fromEnvironment() in riftal-game's shared lib throws on a missing or
      # empty value rather than guess an identity.
      INSTANCE_ID: ${INSTANCE_ID}
      # The zones seed-levels.sh puts on /data/worlds before PocketMine starts,
      # each from /etc/riftal/levels/<zone>. instance-b sets none and mounts no
      # level.
      RIFTAL_LEVEL_ZONES: lumber mine_a mine_b mine_c quarry farm
      # RiftalMines connects as the mines login (ADR 008), and riftal-game's
      # DatabaseSettings reads its password from here, never from a file on
      # the volume. The migration runner provisions the login from the same
      # images/.env value. The root password is never given to an instance,
      # and instance-b loads no mines, so it is not given this either.
      RIFTAL_DB_PASSWORD_MINES: ${RIFTAL_DB_PASSWORD_MINES}
      # RiftalRanks connects as the ranks login (ADR 008), and riftal-game's
      # DatabaseSettings reads its password from here, never from a file on
      # the volume. The migration runner provisions the login from the same
      # images/.env value. instance-b loads no ranks and is not given it.
      RIFTAL_DB_PASSWORD_RANKS: ${RIFTAL_DB_PASSWORD_RANKS}
      # RiftalEconomy connects as the economy login the same way, on this
      # instance and on instance-b.
      RIFTAL_DB_PASSWORD_ECONOMY: ${RIFTAL_DB_PASSWORD_ECONOMY}
      # RiftalPlots connects as the plots login, on this instance and on
      # instance-b, so a claim made on either is written to the shared
      # database (spec 017 criterion 4, riftal-infra#345).
      RIFTAL_DB_PASSWORD_PLOTS: ${RIFTAL_DB_PASSWORD_PLOTS}
      # Flags beat server.properties in ServerConfigGroup, so the instance
      # needs no config file mounted in and the world volume stays the only
      # durable state.
      #
      # xbox-auth=false does not disable Xbox Live sign-in, it stops the server
      # requiring it: a signed-in client joining directly still authenticates
      # and still carries a real XUID. See
      # ../../pmmp-core/docs/player-identity-consequences-for-m1.md, the matrix.
      #
      # riftal-dev-bots admits the headless bots from devtools/bot through
      # plugins/RiftalDevBots.php. That plugin refuses them whenever
      # xbox-auth is on, so the flag cannot open a production server today.
      # It stops being enough once WaterdogPE ships, since every proxied
      # downstream also runs xbox-auth=false (riftal-infra#113), so
      # RIFTAL_DEV_ENV below is the plugin's second, independent signal: a
      # plain environment variable, never a PocketMine config value, that no
      # production deploy path has any reason to set.
      RIFTAL_DEV_ENV: "1"
      # RiftalAccounts loads on every instance, since every instance runs
      # RiftalCustody, a game plugin, and connects as the accounts login (ADR
      # 008); riftal-game's DatabaseSettings reads its password from here,
      # never from a file on the volume. The migration runner provisions the
      # login from the same images/.env value, and instance-b gets it too.
      RIFTAL_DB_PASSWORD_ACCOUNTS: ${RIFTAL_DB_PASSWORD_ACCOUNTS}
      # auto-report.enabled keeps crash dumps, which carry config and from M1
      # alpha player data, off crash.axolotl-pm.org (riftal-infra#232). It has
      # to be 0: ServerConfigGroup::getPropertyBool() casts the flag's string,
      # and (bool) "false" is true. As a flag it leaves /data/pocketmine.yml
      # the full default file, where a hand-written one would drop keys such
      # as plugins.legacy-data-dir, whose absence reads as true.
      POCKETMINE_ARGS: >-
        --level-name=mine_a
        --level-type=normal
        --xbox-auth=false
        --motd=riftal-dev
        --riftal-dev-bots=on
        --auto-report.enabled=0
    # Rollout order, the same one /deploy-release uses: database, then
    # instances. With RiftalMines.phar built, the plugin connects to MySQL
    # synchronously on enable, and a database that does not answer yet takes
    # the whole server down within seconds of boot.
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - riftal-dev

  # A second instance, same image and same MySQL, proving the instance-split
  # shape (riftal-infra#6, CLAUDE.md hard rule 5) before any gameplay depends
  # on it. Its instance_id, world, volume, published port and start command
  # differ from `instance`'s on purpose; its image and limits match. The one
  # thing that must NOT differ is which MySQL it points at, and
  # nothing here does, because neither service names one; both share
  # `riftal-dev` and reach the same `mysql` alias.
  instance-b:
    image: local-pocketmine-mp
    mem_limit: 2G
    cpus: 2
    stdin_open: true
    # A distinct host port. The container still listens on 19132 internally;
    # 19133 is only where the host maps it, same pattern as INSTANCE_BIND
    # above for the first instance.
    ports:
      - "${INSTANCE_B_BIND:-127.0.0.1}:19133:19132/udp"
    volumes:
      - riftal-world-b:/data
      - ./plugins:/plugins
      # See riftal-capture on `instance`, above.
      - riftal-capture:/capture:ro
      # The same file `instance` gets. It names worlds, never instances.
      - ../designer/world_index.json:/etc/riftal/world_index.json:ro
    # See RiftalCustody on `instance`, above. instance-b/start.sh loads
    # RiftalEconomy and RiftalPlots beside the shared plugins and neither
    # RiftalMines nor RiftalRanks.
    command: ["bash", "/plugins/restart/boot-gate.sh", "bash", "/plugins/deliver-world-index.sh", "bash", "/plugins/require-accounts.sh", "bash", "/plugins/require-custody.sh", "bash", "/plugins/instance-b/start.sh"]
    # See restart and healthcheck on `instance`, above.
    restart: on-failure
    healthcheck: *raknet-health
    environment:
      INSTANCE_ID: ${INSTANCE_B_ID}
      # See RIFTAL_DEV_ENV on `instance`, above; same reason, same value.
      RIFTAL_DEV_ENV: "1"
      # See RIFTAL_DB_PASSWORD_ACCOUNTS on `instance`, above.
      RIFTAL_DB_PASSWORD_ACCOUNTS: ${RIFTAL_DB_PASSWORD_ACCOUNTS}
      # A chest shop sale on this instance pays a seller from the balance
      # ledger `instance` writes too (spec 017 criterion 20), so RiftalEconomy
      # connects here as the same economy login, ADR 008.
      RIFTAL_DB_PASSWORD_ECONOMY: ${RIFTAL_DB_PASSWORD_ECONOMY}
      # See RIFTAL_DB_PASSWORD_PLOTS on `instance`, above. The level-name
      # below is not `plots`, so this instance hosts no plot grid and a claim
      # made here teleports nobody.
      RIFTAL_DB_PASSWORD_PLOTS: ${RIFTAL_DB_PASSWORD_PLOTS}
      # A different level-name and level-type than `instance`, above, so the
      # split is exercised against two genuinely different worlds rather than
      # one world cloned onto a second port. auto-report.enabled=0 as on
      # `instance`, above.
      POCKETMINE_ARGS: >-
        --level-name=plots_b
        --level-type=flat
        --xbox-auth=false
        --motd=riftal-dev-b
        --riftal-dev-bots=on
        --auto-report.enabled=0
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - riftal-dev

  # A coordinated MySQL dump plus a tar of every world volume, on a schedule,
  # pruned to a retention count (docs/specs/008-backup-and-restore.md).
  # Its own image, because backup.sh needs flock beside mysqldump and mysql:8
  # has no flock; see backup/Dockerfile.
  backup:
    build: ./backup
    image: riftal-backup
    command: ["bash", "/deploy/backup-loop.sh"]
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      # See ../deploy/README.md, The dump login. `dump-login` creates this
      # login from the same variable before this service may start. It writes
      # no table directly; the fence procedures and trigger DDL are the
      # exceptions listed there.
      MYSQL_USER: backup
      MYSQL_PASSWORD: ${RIFTAL_DB_PASSWORD_BACKUP}
      MYSQL_DATABASE: riftal_dev
      BACKUP_RETENTION: ${BACKUP_RETENTION:-10}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-21600}
      PARTIAL_MAX_AGE_MINUTES: ${PARTIAL_MAX_AGE_MINUTES:-360}
      LOCK_MAX_AGE_MINUTES: ${LOCK_MAX_AGE_MINUTES:-90}
      CAPTURE_ACK_TIMEOUT_SECONDS: ${CAPTURE_ACK_TIMEOUT_SECONDS:-60}
      CAPTURE_HOLD_MAX_SECONDS: ${CAPTURE_HOLD_MAX_SECONDS:-900}
      CAPTURE_FENCE_MAX_SECONDS: ${CAPTURE_FENCE_MAX_SECONDS:-1800}
      FENCE_TEST_STALL_SECONDS: ${FENCE_TEST_STALL_SECONDS:-0}
    volumes:
      - riftal-backups:/backups
      # The one read-write mount of riftal-capture: backup.sh writes the
      # request, and each instance answers on its own volume below.
      - riftal-capture:/capture
      # One read-only mount per instance world volume. Adding an instance
      # (/add-instance) adds its line here; backup.sh enumerates whatever it
      # finds under /worlds rather than assuming this list's length.
      - riftal-world:/worlds/riftal-world:ro
      - riftal-world-b:/worlds/riftal-world-b:ro
      - ../deploy:/deploy:ro
    depends_on:
      mysql:
        condition: service_healthy
      dump-login:
        condition: service_completed_successfully
    networks:
      - riftal-dev

  # Creates or rotates the `backup` login, then exits. It runs on every `up`,
  # so images/.env always decides the password, and a failure here keeps
  # `backup` from starting rather than leaving it to fail on every interval.
  # It applies no migrations and no grants file: with only
  # RIFTAL_DB_PASSWORD_BACKUP passed in, the runner provisions the dump login
  # alone, whose role it creates itself. Migrations and the plugin logins stay
  # the operator's run in ../migrations/README.md, which holds the same lock.
  dump-login:
    image: mysql:8
    # An empty variable would otherwise reach the runner as a short password,
    # and an unset one as no login to provision at all.
    command:
      - bash
      - -c
      - >-
        [ -n "$$RIFTAL_DB_PASSWORD_BACKUP" ] || {
        echo "RIFTAL_DB_PASSWORD_BACKUP is empty: set it in images/.env, see .env.example" >&2;
        exit 1; };
        exec bash /migrations/run-migrations.sh
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: riftal_dev
      RIFTAL_DB_PASSWORD_BACKUP: ${RIFTAL_DB_PASSWORD_BACKUP}
    volumes:
      - ../migrations/run-migrations.sh:/migrations/run-migrations.sh:ro
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - riftal-dev

networks:
  # Named so that the network a wslc bring-up creates by hand is the same one
  # compose would have created.
  riftal-dev:
    name: riftal-dev

volumes:
  # A world and a database are not container-layer state. Neither name is a
  # riftal_smoke_ name, so the guard protects both, which is the point.
  riftal-mysql:
    name: riftal-mysql
  riftal-world:
    name: riftal-world
  riftal-world-b:
    name: riftal-world-b
  # Backup artifacts are exactly the kind of durable state this table is
  # about: a container being replaced must never take a backup set with it.
  riftal-backups:
    name: riftal-backups
  # Holds only the backup's capture request, never durable state, but a fixed
  # name keeps a wslc bring-up and compose on the same volume.
  riftal-capture:
    name: riftal-capture
  # Filled by `designer level build <zone>` (designer/levels/README.md), never
  # by compose: a volume compose created itself would be empty, and `up` would
  # carry on with nothing to seed. External, so `up` stops naming the volume
  # when it is missing, and an unbuilt one is refused by seed-levels.sh.
  # A cache, rebuilt by one build run; its name is a riftal_smoke_ name for
  # that reason.
  riftal_smoke_level_lumber:
    name: riftal_smoke_level_lumber
    external: true
  riftal_smoke_level_mine_a:
    name: riftal_smoke_level_mine_a
    external: true
  riftal_smoke_level_mine_b:
    name: riftal_smoke_level_mine_b
    external: true
  riftal_smoke_level_mine_c:
    name: riftal_smoke_level_mine_c
    external: true
  riftal_smoke_level_quarry:
    name: riftal_smoke_level_quarry
    external: true
  riftal_smoke_level_farm:
    name: riftal_smoke_level_farm
    external: true
